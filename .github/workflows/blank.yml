name: TEST COMPLET - Ganama Quincaillerie

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Vérification complète et construction APK
    runs-on: ubuntu-latest

    steps:

      # 1 - Récupérer le projet
      - name: 1 - Récupérer le projet
        uses: actions/checkout@v7

      # 2 - Installer Java 17
      - name: 2 - Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3 - Installer Android SDK
      - name: 3 - Installer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-36
            build-tools;36.0.0
            platform-tools

      # 4 - Diagnostic complet du projet
      - name: 4 - DIAGNOSTIC COMPLET DU PROJET
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "DIAGNOSTIC COMPLET DU PROJET"
          echo "========================================"

          echo ""
          echo "=== VERSION JAVA ==="
          java -version

          echo ""
          echo "=== VERSION ADB ==="
          adb version || true

          echo ""
          echo "=== DOSSIER ACTUEL ==="
          pwd

          echo ""
          echo "=== STRUCTURE DU PROJET ==="
          find . -maxdepth 4 -type f | sort

          echo ""
          echo "=== FICHIERS GRADLE ==="

          test -f settings.gradle.kts || {
            echo "ERREUR: settings.gradle.kts MANQUANT"
            exit 1
          }

          test -f build.gradle.kts || {
            echo "ERREUR: build.gradle.kts MANQUANT"
            exit 1
          }

          test -f app/build.gradle.kts || {
            echo "ERREUR: app/build.gradle.kts MANQUANT"
            exit 1
          }

          echo "OK: fichiers Gradle présents"

          echo ""
          echo "=== FICHIERS ANDROID ==="

          test -f app/src/main/AndroidManifest.xml || {
            echo "ERREUR: AndroidManifest.xml MANQUANT"
            exit 1
          }

          test -f app/src/main/java/com/ganama/quincaillerie/MainActivity.java || {
            echo "ERREUR: MainActivity.java MANQUANT"
            exit 1
          }

          test -f app/src/main/res/layout/activity_main.xml || {
            echo "ERREUR: activity_main.xml MANQUANT"
            exit 1
          }

          echo "OK: fichiers Android essentiels présents"

      # 5 - Vérifier le Manifest
      - name: 5 - Vérifier AndroidManifest
        shell: bash
        run: |
          set -e

          FILE="app/src/main/AndroidManifest.xml"

          echo "========================================"
          echo "CONTENU DU MANIFEST"
          echo "========================================"

          cat "$FILE"

          echo ""
          echo "========================================"
          echo "VERIFICATION DU MANIFEST"
          echo "========================================"

          grep -Eq 'android.intent.action.MAIN' "$FILE" || {
            echo "ERREUR: ACTION MAIN MANQUANTE"
            exit 1
          }

          grep -Eq 'android.intent.category.LAUNCHER' "$FILE" || {
            echo "ERREUR: CATEGORIE LAUNCHER MANQUANTE"
            exit 1
          }

          grep -Eq 'android:name="(\.MainActivity|com\.ganama\.quincaillerie\.MainActivity)"' "$FILE" || {
            echo "ERREUR: MainActivity non déclarée correctement"
            exit 1
          }

          echo "OK: Manifest vérifié"

      # 6 - Vérifier le Gradle Wrapper
      - name: 6 - Vérifier Gradle Wrapper
        shell: bash
        run: |
          set -e

          test -f gradlew || {
            echo "ERREUR: gradlew MANQUANT"
            exit 1
          }

          test -f gradle/wrapper/gradle-wrapper.properties || {
            echo "ERREUR: gradle-wrapper.properties MANQUANT"
            exit 1
          }

          chmod +x gradlew

          echo "Gradle Wrapper:"
          ./gradlew --version

      # 7 - Vérifier les tâches Gradle
      - name: 7 - Vérifier les tâches Gradle
        shell: bash
        run: |
          set -e

          echo "Recherche de assembleDebug..."

          ./gradlew :app:tasks --all --no-daemon | tee gradle_tasks.txt

          grep -q "assembleDebug" gradle_tasks.txt || {
            echo "ERREUR: la tâche assembleDebug est introuvable"
            exit 1
          }

          echo "OK: assembleDebug existe"

      # 8 - Nettoyer le projet
      - name: 8 - Nettoyer le projet
        run: |
          ./gradlew clean --no-daemon

      # 9 - Tests unitaires
      - name: 9 - Tests unitaires
        run: |
          ./gradlew test --no-daemon --stacktrace

      # 10 - Vérification Android/Lint
      - name: 10 - Vérification Android
        run: |
          ./gradlew lintDebug --no-daemon --stacktrace

      # 11 - Construire l'APK Debug
      - name: 11 - Construire l'APK Debug
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 12 - Vérifier que l'APK existe
      - name: 12 - Vérifier l'APK généré
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "RECHERCHE DE L'APK"
          echo "========================================"

          find app/build/outputs/apk -type f -name "*.apk" -print

          APK_PATH="$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "ERREUR: aucun APK généré"
            exit 1
          fi

          echo "APK TROUVÉ:"
          echo "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # 13 - Vérifier les informations de l'APK
      - name: 13 - Vérifier le contenu de l'APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFICATION APK"
          echo "========================================"

          ls -lh "$APK_PATH"

          echo ""
          echo "=== INFORMATIONS APK ==="

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH" | head -n 30

          echo ""
          echo "APK valide et lisible."

      # 14 - Conserver l'APK
      - name: 14 - Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Ganama-Quincaillerie-APK-Debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      # 15 - Rapport final
      - name: 15 - RAPPORT FINAL
        if: always()
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "FIN DU TEST"
          echo "========================================"

          if [ -n "${APK_PATH:-}" ] && [ -f "$APK_PATH" ]; then
            echo "RESULTAT: APK GENERE AVEC SUCCES"
            echo "APK: $APK_PATH"
          else
            echo "RESULTAT: APK NON GENERE"
          fi
