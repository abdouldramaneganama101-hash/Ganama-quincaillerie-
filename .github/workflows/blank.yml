name: Test complet et APK - Ganama Quincaillerie

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-and-build:
    name: Vérification complète Android
    runs-on: ubuntu-latest

    steps:
      - name: 1 - Récupérer le projet
        uses: actions/checkout@v4

      - name: 2 - Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3 - Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: 4 - Vérifier la structure
        shell: bash
        run: |
          set -e

          echo "===== STRUCTURE DU PROJET ====="
          find . -maxdepth 4 -type f | sort

          echo "===== VERIFICATION DES FICHIERS ESSENTIELS ====="

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/ganama/quincaillerie/MainActivity.java
          test -f app/src/main/res/layout/activity_main.xml

          echo "Tous les fichiers essentiels sont présents."

      - name: 5 - Vérifier la configuration Android
        shell: bash
        run: |
          set -e

          echo "===== BUILD GRADLE APP ====="
          cat app/build.gradle.kts

          echo "===== SETTINGS GRADLE ====="
          cat settings.gradle.kts

          echo "===== VERIFICATION APPLICATION ID ====="

          grep -q 'applicationId = "com.ganama.quincaillerie"' app/build.gradle.kts

          echo "Application ID correcte."

      - name: 6 - Vérifier MainActivity
        shell: bash
        run: |
          set -e

          echo "===== MAIN ACTIVITY ====="
          cat app/src/main/java/com/ganama/quincaillerie/MainActivity.java

          grep -q 'package com.ganama.quincaillerie;' \
            app/src/main/java/com/ganama/quincaillerie/MainActivity.java

          echo "Package Java correct."

      - name: 7 - Vérifier AndroidManifest
        shell: bash
        run: |
          set -e

          echo "===== ANDROID MANIFEST ====="
          cat app/src/main/AndroidManifest.xml

          grep -q 'android.intent.action.MAIN' \
            app/src/main/AndroidManifest.xml

          grep -q 'android.intent.category.LAUNCHER' \
            app/src/main/AndroidManifest.xml

          echo "MAIN + LAUNCHER correctement configurés."

      - name: 8 - Vérifier les ressources
        shell: bash
        run: |
          set -e

          echo "===== RESSOURCES ====="
          find app/src/main/res -type f | sort

          echo "===== FICHIERS WEB ====="
          find app/src/main/assets -type f 2>/dev/null | sort || true

      - name: 9 - Préparer Gradle
        shell: bash
        run: |
          set -e

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            echo "Gradle Wrapper trouvé."
          else
            echo "Gradle Wrapper absent."
            echo "Installation de Gradle 8.13..."
            sudo apt-get update
            sudo apt-get install -y gradle
          fi

      - name: 10 - Vérifier Gradle
        shell: bash
        run: |
          set -e

          if [ -f ./gradlew ]; then
            ./gradlew --version
          else
            gradle --version
          fi

      - name: 11 - Nettoyer le projet
        shell: bash
        run: |
          set -e

          if [ -f ./gradlew ]; then
            ./gradlew clean
          else
            gradle clean
          fi

      - name: 12 - Compiler réellement l'APK
        shell: bash
        run: |
          set -e

          echo "===== COMPILATION APK DEBUG ====="

          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: 13 - Vérifier que l'APK existe
        shell: bash
        run: |
          set -e

          echo "===== APK TROUVÉS ====="
          find . -type f -name "*.apk" -print

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "APK DEBUG trouvé avec succès."

      - name: 14 - Vérifier l'identité de l'APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "===== APK ====="
          ls -lh "$APK"

          echo "===== INFORMATIONS APK ====="
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt dump badging "$APK" | head -30

      - name: 15 - Publier l'APK final
        uses: actions/upload-artifact@v4
        with:
          name: Ganama-Quincaillerie-APK-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
