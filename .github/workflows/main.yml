  run: ./gradlew assembleDebug --no-daemon ./gradlew assembleDebug --no-daemonname: Build Ganama Quincaillerie APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Télécharger le dépôt
      uses: actions/checkout@v4

    - name: Configurer Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Rendre Gradle exécutable
      run: chmod +x gradlew

    - name: Compiler l'APK Debug
      run: ./gradlew assembleDebug

    - name: Sauvegarder l'APK (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Ganama-Quincaillerie-APK
        path: app/build/outputs/apk/debug/app-debug.apk
