name: Build Ganama Quincaillerie APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Trouver Gradle
        run: |
          echo "Recherche de gradlew..."
          find . -name gradlew -type f

      - name: Donner les permissions a Gradle
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          chmod +x "$GRADLEW"
          echo "Gradle trouve ici : $GRADLEW"

      - name: Compiler l'application
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Recuperer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Ganama-Quincaillerie-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'name: Build Ganama Quincaillerie APK

