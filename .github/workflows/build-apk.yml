name: TEST COMPLET - Ganama Quincaillerie

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Vérification complète et construction APK
    runs-on: ubuntu-latest

    steps:

      - name: 1 - Télécharger le projet
        uses: actions/checkout@v4

      - name: 2 - Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3 - Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: 4 - DIAGNOSTIC COMPLET DU PROJET
        shell: bash
        run: |
          echo "======================================"
          echo "        STRUCTURE DU PROJET"
          echo "======================================"

          pwd

          echo ""
          echo "FICHIERS PRESENTS :"
          find . -type f | sort

          echo ""
          echo "======================================"
          echo "        FICHIERS ESSENTIELS"
          echo "======================================"

          files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/ganama/quincaillerie/MainActivity.java"
            "app/src/main/res/layout/activity_main.xml"
            "app/src/main/res/values/strings.xml"
            "app/src/main/res/values/themes.xml"
            "app/src/main/res/drawable/ic_ganama_launcher.xml"
            "app/src/main/assets/index.html"
          )

          ERREUR=0

          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              echo "OK      : $f"
            else
              echo "MANQUANT: $f"
              ERREUR=1
            fi
          done

          echo ""
          echo "======================================"

          if [ "$ERREUR" -eq 1 ]; then
            echo "ATTENTION : un ou plusieurs fichiers sont absents."
            echo "Le test continue volontairement pour montrer toutes les erreurs."
          else
            echo "OK : TOUS LES FICHIERS ESSENTIELS SONT PRESENTS."
          fi

      - name: 5 - Vérifier Gradle
        shell: bash
        run: |
          set -e

          echo "===== BUILD GRADLE ====="
          cat build.gradle.kts

          echo "===== APP BUILD GRADLE ====="
          cat app/build.gradle.kts

          echo "===== SETTINGS ====="
          cat settings.gradle.kts

          echo "===== VERSION GRADLE ====="
          gradle --version

      - name: 6 - Vérifier MainActivity
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/ganama/quincaillerie/MainActivity.java"

          echo "===== MAIN ACTIVITY ====="
          cat "$FILE"

          grep -Fq 'package com.ganama.quincaillerie;' "$FILE"
          grep -Fq 'setContentView(R.layout.activity_main)' "$FILE"
          grep -Fq 'findViewById(R.id.webview)' "$FILE"
          grep -Fq 'loadUrl("file:///android_asset/index.html")' "$FILE"

          echo "OK : MainActivity"

      - name: 7 - Vérifier AndroidManifest
        shell: bash
        run: |
          set -e

          FILE="app/src/main/AndroidManifest.xml"

          echo "===== MANIFEST ====="
          cat "$FILE"

          grep -Fq 'android:name=".MainActivity"' "$FILE"
          grep -Fq 'android:exported="true"' "$FILE"
          grep -Fq 'android.intent.action.MAIN' "$FILE"
          grep -Fq 'android.intent.category.LAUNCHER' "$FILE"
          grep -Fq 'android:label="@string/app_name"' "$FILE"

          echo "OK : MAIN + LAUNCHER"
          echo "L'application est configurée pour apparaître dans le téléphone."

      - name: 8 - Vérifier WebView et HTML
        shell: bash
        run: |
          set -e

          grep -Fq 'android:id="@+id/webview"' \
            app/src/main/res/layout/activity_main.xml

          test -s app/src/main/assets/index.html

          echo "===== HTML ====="
          head -80 app/src/main/assets/index.html

          echo "OK : WebView et index.html"

      - name: 9 - Vérifier les images
        shell: bash
        run: |
          set -e

          echo "===== IMAGES ====="
          find app/src/main/assets/images -type f -print

          for f in app/src/main/assets/images/*; do
            if [ -s "$f" ]; then
              echo "OK : $f"
            else
              echo "ERREUR : fichier vide : $f"
              exit 1
            fi
          done

      - name: 10 - Vérifier les XML
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          files = [
              "app/src/main/AndroidManifest.xml",
              "app/src/main/res/layout/activity_main.xml",
              "app/src/main/res/values/strings.xml",
              "app/src/main/res/values/themes.xml",
              "app/src/main/res/drawable/ic_ganama_launcher.xml"
          ]

          for f in files:
              ET.parse(f)
              print("OK XML :", f)
          PY

      - name: 11 - Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: 12 - Nettoyer
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon

      - name: 13 - COMPILATION REELLE APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       CONSTRUCTION DE L'APK"
          echo "======================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: 14 - Vérifier APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "===== RECHERCHE APK ====="

          find app/build -type f -name "*.apk" -print

          test -s "$APK"

          echo ""
          echo "APK TROUVE :"
          ls -lh "$APK"

      - name: 15 - Vérifier identité APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          "$AAPT" dump badging "$APK" > /tmp/apk.txt

          cat /tmp/apk.txt

          grep -Fq "com.ganama.quincaillerie" /tmp/apk.txt
          grep -Fq "Ganama Quincaillerie" /tmp/apk.txt
          grep -Fq "com.ganama.quincaillerie.MainActivity" /tmp/apk.txt

          echo "OK : identité APK correcte."

      - name: 16 - Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Ganama-Quincaillerie-APK-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
