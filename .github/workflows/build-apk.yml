name: Build Ganama Quincaillerie APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decompresser le projet Android
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -1)
          unzip -q "$ZIP" -d extracted

          PROJECT_DIR=$(find extracted -type d -name app -print -quit | xargs dirname)

          echo "Projet Android trouve dans: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compiler l APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publier l APK
        uses: actions/upload-artifact@v4
        with:
          name: Ganama-Quincaillerie-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
