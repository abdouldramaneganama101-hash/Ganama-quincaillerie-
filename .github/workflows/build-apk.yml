name: Build Ganama Quincaillerie APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer SDK Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Décompresser UNIQUEMENT la version finale
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Ganama_Quincaillerie_ANDROID_FINAL_VERIFIE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERREUR : $ZIP est introuvable à la racine du dépôt."
            echo "Les autres ZIP ne seront PAS utilisés."
            exit 1
          fi

          rm -rf android-project
          mkdir android-project
          unzip -q "$ZIP" -d android-project

          # Le ZIP final contient le projet à sa racine.
          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts
          test -f android-project/app/src/main/AndroidManifest.xml
          test -f android-project/app/src/main/assets/index.html- name: Vérifier les ressources
        shell: bash
        run: |
          set -e
          for f in             app/src/main/assets/images/aspirateur.svg             app/src/main/assets/images/chaise.svg             app/src/main/assets/images/gobelet.svg             app/src/main/assets/images/tondeuse.svg             app/src/main/assets/images/musculation.svg
          do
            test -f "android-project/$f"
          done

      - name: Compiler l'APK
        working-directory: android-project
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Vérifier l'APK final
        run: |
          test -s android-project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Ganama-Quincaillerie-APK-FINAL
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
