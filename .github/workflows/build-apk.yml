name: Build Ganama Quincaillerie APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Vérifier le projet
  run: |
    echo "Dossier actuel :"
    pwd
    echo "Fichiers présents :"
    ls -la
    echo "Dossier app :"
    ls -la app

- name: Compiler l'application
  run: gradle :app:assembleDebug --no-daemon

      - name: Recuperer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Ganama-Quincaillerie-APK
          path: app/build/outputs/apk/debug/app-debug.apk
