name: Build Ganama Quincaillerie APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Décompresser le projet
        run: |
          mkdir project
          unzip -q Ganama_Quincaillerie_Android_v2_Gradle.zip -d project

      - name: Installer Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip
          echo "$PWD/gradle-8.13/bin" >> $GITHUB_PATH

      - name: Compiler l'application
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Ganama-Quincaillerie-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
