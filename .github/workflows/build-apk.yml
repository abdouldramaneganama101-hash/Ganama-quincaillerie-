name: Build Ganama Quincaillerie APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Préparer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Décompresser le projet Android
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun fichier ZIP du projet n'a été trouvé à la racine du dépôt."
            exit 1
          fi
          rm -rf android-project
          mkdir android-project
          unzip -q "$ZIP" -d android-project

          # Si le ZIP contient un seul dossier racine, on l'utilise directement.
          if [ ! -f android-project/settings.gradle.kts ] && [ ! -f android-project/settings.gradle ]; then
            ROOT="$(find android-project -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            if [ -n "$ROOT" ] && { [ -f "$ROOT/settings.gradle.kts" ] || [ -f "$ROOT/settings.gradle" ]; }; then
              mv "$ROOT"/* android-project/ 2>/dev/null || true
              mv "$ROOT"/.[!.]* android-project/ 2>/dev/null || true
              rmdir "$ROOT" 2>/dev/null || true
            fi
          fi

          test -f android-project/settings.gradle.kts || test -f android-project/settings.gradle
          test -f android-project/app/build.gradle.kts || test -f android-project/app/build.gradle

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Vérifier la configuration Gradle
        working-directory: android-project
        run: gradle --version

      - name: Construire l'APK
        working-directory: android-project
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Vérifier l'APK
        run: |
          test -f android-project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Ganama-Quincaillerie-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
