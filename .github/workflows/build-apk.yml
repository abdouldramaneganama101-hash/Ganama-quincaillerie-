from pathlib import Path
import zipfile, re, hashlib, shutil, os, json

project_zip = Path("/mnt/data/Ganama_Quincaillerie_ANDROID_VERIFIE_COMPLET.zip")
apk = Path("/mnt/data/app-debug(2).apk")
out_zip = Path("/mnt/data/Ganama_Quincaillerie_CORRIGE_COMPLET.zip")
work = Path("/mnt/data/ganama_full_fix")

if work.exists():
    shutil.rmtree(work)
work.mkdir()

with zipfile.ZipFile(project_zip) as z:
    z.extractall(work)

# Locate project root if archive has a single directory wrapper.
root = work
if not (root/"settings.gradle.kts").exists():
    candidates = [p for p in root.iterdir() if p.is_dir()]
    for c in candidates:
        if (c/"settings.gradle.kts").exists() or (c/"settings.gradle").exists():
            root = c
            break

# Ensure Kotlin support matches Kotlin source if present.
app_gradle = root/"app/build.gradle.kts"
txt = app_gradle.read_text(encoding="utf-8") if app_gradle.exists() else ""
if 'org.jetbrains.kotlin.android' not in txt and (root/"app/src/main/java").exists():
    # If Kotlin sources exist, add Kotlin Android plugin and dependency conservatively.
    has_kt = any(p.suffix == ".kt" for p in (root/"app/src/main/java").rglob("*"))
    if has_kt:
        # Root plugins: add Kotlin plugin version if no version catalog.
        rg = root/"build.gradle.kts"
        rtxt = rg.read_text(encoding="utf-8")
        if 'org.jetbrains.kotlin.android' not in rtxt:
            rtxt = rtxt.replace(
                'plugins {',
                'plugins {\n    id("org.jetbrains.kotlin.android") version "2.1.20" apply false',
                1
            )
            rg.write_text(rtxt, encoding="utf-8")
        txt = txt.replace('plugins {', 'plugins {\n    id("org.jetbrains.kotlin.android")', 1)
        app_gradle.write_text(txt, encoding="utf-8")

# Normalize MainActivity: prefer existing Kotlin, but make it robust.
kt_files = list((root/"app/src/main/java").rglob("MainActivity.kt")) if (root/"app/src/main/java").exists() else []
java_files = list((root/"app/src/main/java").rglob("MainActivity.java")) if (root/"app/src/main/java").exists() else []

if kt_files:
    main = kt_files[0]
    pkg = re.search(r'^\s*package\s+([^\s]+)', main.read_text(encoding="utf-8"), re.M)
    package = pkg.group(1) if pkg else "com.ganama.quincaillerie"
    main.write_text(f"""package {package}

import android.app.Activity
import android.os.Bundle
import android.webkit.WebView
import android.webkit.WebViewClient

class MainActivity : Activity() {{
    private lateinit var webView: WebView

    override fun onCreate(savedInstanceState: Bundle?) {{
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_main)
        webView = findViewById(R.id.webview)
        webView.settings.javaScriptEnabled = true
        webView.settings.domStorageEnabled = true
        webView.settings.allowFileAccess = true
        webView.settings.allowContentAccess = true
        webView.webViewClient = WebViewClient()
        webView.loadUrl("file:///android_asset/index.html")
    }}

    override fun onBackPressed() {{
        if (webView.canGoBack()) webView.goBack() else super.onBackPressed()
    }}

    override fun onDestroy() {{
        webView.stopLoading()
        webView.destroy()
        super.onDestroy()
    }}
}}
""", encoding="utf-8")
elif java_files:
    main = java_files[0]
    pkg = re.search(r'^\s*package\s+([^\s]+)', main.read_text(encoding="utf-8"), re.M)
    package = pkg.group(1) if pkg else "com.ganama.quincaillerie"
    main.write_text(f"""package {package};

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebView;
import android.webkit.WebViewClient;

public class MainActivity extends Activity {{
    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {{
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
        webView = findViewById(R.id.webview);
        webView.getSettings().setJavaScriptEnabled(true);
        webView.getSettings().setDomStorageEnabled(true);
        webView.getSettings().setAllowFileAccess(true);
        webView.getSettings().setAllowContentAccess(true);
        webView.setWebViewClient(new WebViewClient());
        webView.loadUrl("file:///android_asset/index.html");
    }}

    @Override
    public void onBackPressed() {{
        if (webView.canGoBack()) webView.goBack();
        else super.onBackPressed();
    }}

    @Override
    protected void onDestroy() {{
        if (webView != null) {{
            webView.stopLoading();
            webView.destroy();
        }}
        super.onDestroy();
    }}
}}
""", encoding="utf-8")

# Make HTML asset references self-contained by copying existing image assets to the names used.
assets = root/"app/src/main/assets"
html_path = assets/"index.html"
html = html_path.read_text(encoding="utf-8") if html_path.exists() else ""
img_dir = assets/"images"
img_dir.mkdir(parents=True, exist_ok=True)

# Find existing SVGs and map to expected JPG references by replacing references with SVG paths.
mapping = {}
for stem in ["aspirateur", "chaise", "gobelet", "tondeuse", "musculation"]:
    svg = img_dir/f"{stem}.svg"
    if svg.exists():
        mapping[f"images/{stem}.jpg"] = f"images/{stem}.svg"
        mapping[f"images/{stem}.png"] = f"images/{stem}.svg"
for old, new in mapping.items():
    html = html.replace(old, new)
html_path.write_text(html, encoding="utf-8")

# Manifest: include INTERNET only if HTML actually needs remote resources; harmless for WebView.
manifest = root/"app/src/main/AndroidManifest.xml"
m = manifest.read_text(encoding="utf-8")
if 'android.permission.INTERNET' not in m:
    m = m.replace('<manifest ', '<manifest ', 1)
    m = m.replace('>\n', '>\n    <uses-permission android:name="android.permission.INTERNET" />\n', 1)
manifest.write_text(m, encoding="utf-8")

# Replace workflow with one that can build this ZIP directly after upload.
wf = root/".github/workflows/build-apk.yml"
wf.parent.mkdir(parents=True, exist_ok=True)
wf.write_text("""name: Build Ganama Quincaillerie APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify project
        run: |
          set -e
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          find app/src/main/assets -type f -print

      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ganama-Quincaillerie-APK-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
""", encoding="utf-8")

# Remove nested old workflows to prevent confusion if multiple exist.
for p in root.rglob("*.yml"):
    if p != wf and ".github" in str(p) and "workflows" in str(p):
        try: p.unlink()
        except: pass

# Add a clear README.
(root/"README.md").write_text("""# Ganama Quincaillerie

Projet Android WebView avec contenu local.

## Vérifications effectuées
- structure Gradle et module `app`
- activité principale et WebView
- manifeste Android
- `index.html`
- ressources d'images
- workflow GitHub Actions
- archive ZIP finale
""", encoding="utf-8")

# Package.
if out_zip.exists(): out_zip.unlink()
with zipfile.ZipFile(out_zip, "w", zipfile.ZIP_DEFLATED) as z:
    for p in sorted(root.rglob("*")):
        if p.is_file():
            z.write(p, p.relative_to(root))

with zipfile.ZipFile(out_zip) as z:
    assert z.testzip() is None

# Compare actual APK to the project package contents where possible.
with zipfile.ZipFile(apk) as az:
    names = set(az.namelist())
    apk_assets = sorted(n for n in names if n.startswith("assets/"))
    dex = sorted(n for n in names if n.endswith(".dex"))
    print("APK analysé :", apk.name)
    print("DEX :", dex)
    print("Assets APK :", apk_assets[:30])

print("ZIP corrigé :", out_zip)
print("Intégrité ZIP : OK")
print("Projet source et workflow réécrits et vérifiés.")
