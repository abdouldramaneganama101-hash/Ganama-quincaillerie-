name: TEST COMPLET - Ganama Quincaillerie

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Verification complete et construction APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. RECUPERATION DU PROJET
      # ============================================================
      - name: 1 - Recuperer le projet
        uses: actions/checkout@v7

      # ============================================================
      # 2. INSTALLATION DE JAVA 17
      # ============================================================
      - name: 2 - Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 3. INSTALLATION DU SDK ANDROID
      # ============================================================
      - name: 3 - Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      # ============================================================
      # 4. VERIFICATION DE L'ENVIRONNEMENT
      # ============================================================
      - name: 4 - Verifier l'environnement
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ENVIRONNEMENT"
          echo "========================================"

          echo ""
          echo "=== JAVA ==="
          java -version

          echo ""
          echo "=== ANDROID SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "=== ADB ==="
          adb version

          echo ""
          echo "=== SDK MANAGER ==="
          sdkmanager --version

      # ============================================================
      # 5. VERIFICATION DE LA STRUCTURE DU PROJET
      # ============================================================
      - name: 5 - Diagnostic complet du projet
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "DIAGNOSTIC COMPLET DU PROJET"
          echo "========================================"

          echo ""
          echo "=== DOSSIER ACTUEL ==="
          pwd

          echo ""
          echo "=== RACINE DU PROJET ==="
          ls -la

          echo ""
          echo "=== STRUCTURE ==="
          find . -maxdepth 5 -type f | sort

          echo ""
          echo "=== VERIFICATION DES FICHIERS ESSENTIELS ==="

          test -f settings.gradle.kts || {
            echo "ERREUR: settings.gradle.kts MANQUANT"
            exit 1
          }

          test -f build.gradle.kts || {
            echo "ERREUR: build.gradle.kts MANQUANT"
            exit 1
          }

          test -f app/build.gradle.kts || {
            echo "ERREUR: app/build.gradle.kts MANQUANT"
            exit 1
          }

          test -f gradlew || {
            echo "ERREUR: gradlew MANQUANT"
            exit 1
          }

          test -f gradle/wrapper/gradle-wrapper.properties || {
            echo "ERREUR: gradle-wrapper.properties MANQUANT"
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "ERREUR: AndroidManifest.xml MANQUANT"
            exit 1
          }

          test -f app/src/main/java/com/ganama/quincaillerie/MainActivity.java || {
            echo "ERREUR: MainActivity.java MANQUANT"
            exit 1
          }

          test -f app/src/main/res/layout/activity_main.xml || {
            echo "ERREUR: activity_main.xml MANQUANT"
            exit 1
          }

          echo ""
          echo "TOUS LES FICHIERS ESSENTIELS SONT PRESENTS."

      # ============================================================
      # 6. VERIFICATION DE SETTINGS.GRADLE.KTS
      # ============================================================
      - name: 6 - Verifier settings.gradle.kts
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SETTINGS.GRADLE.KTS"
          echo "========================================"

          cat settings.gradle.kts

          grep -q "app" settings.gradle.kts || {
            echo "ERREUR: le module app n'est pas reference"
            exit 1
          }

          echo "OK: settings.gradle.kts"

      # ============================================================
      # 7. VERIFICATION DU BUILD GRADLE PRINCIPAL
      # ============================================================
      - name: 7 - Verifier build.gradle.kts
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILD.GRADLE.KTS"
          echo "========================================"

          cat build.gradle.kts

          echo ""
          echo "OK: build.gradle.kts present"

      # ============================================================
      # 8. VERIFICATION DU BUILD GRADLE DE L'APPLICATION
      # ============================================================
      - name: 8 - Verifier app/build.gradle.kts
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "APP/BUILD.GRADLE.KTS"
          echo "========================================"

          cat app/build.gradle.kts

          grep -q "com.android.application" app/build.gradle.kts || {
            echo "ERREUR: plugin Android application absent"
            exit 1
          }

          grep -q "namespace" app/build.gradle.kts || {
            echo "ERREUR: namespace absent"
            exit 1
          }

          grep -q "applicationId" app/build.gradle.kts || {
            echo "ERREUR: applicationId absent"
            exit 1
          }

          echo ""
          echo "OK: app/build.gradle.kts"

      # ============================================================
      # 9. VERIFICATION DU MANIFEST
      # ============================================================
      - name: 9 - Verifier AndroidManifest.xml
        shell: bash
        run: |
          set -e

          FILE="app/src/main/AndroidManifest.xml"

          echo "========================================"
          echo "ANDROID MANIFEST"
          echo "========================================"

          cat "$FILE"

          echo ""
          echo "========================================"
          echo "VERIFICATION DU MANIFEST"
          echo "========================================"

          grep -Eq 'android.intent.action.MAIN' "$FILE" || {
            echo "ERREUR: ACTION MAIN MANQUANTE"
            exit 1
          }

          grep -Eq 'android.intent.category.LAUNCHER' "$FILE" || {
            echo "ERREUR: CATEGORIE LAUNCHER MANQUANTE"
            exit 1
          }

          grep -Eq 'android:name="(\.MainActivity|com\.ganama\.quincaillerie\.MainActivity)"' "$FILE" || {
            echo "ERREUR: MainActivity NON DECLAREE CORRECTEMENT"
            exit 1
          }

          echo "OK: AndroidManifest.xml"

      # ============================================================
      # 10. VERIFICATION DE MAINACTIVITY
      # ============================================================
      - name: 10 - Verifier MainActivity.java
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/ganama/quincaillerie/MainActivity.java"

          echo "========================================"
          echo "MAIN ACTIVITY"
          echo "========================================"

          cat "$FILE"

          grep -q "package com.ganama.quincaillerie" "$FILE" || {
            echo "ERREUR: package incorrect"
            exit 1
          }

          grep -q "class MainActivity" "$FILE" || {
            echo "ERREUR: classe MainActivity introuvable"
            exit 1
          }

          echo "OK: MainActivity.java"

      # ============================================================
      # 11. VERIFICATION DU LAYOUT
      # ============================================================
      - name: 11 - Verifier activity_main.xml
        shell: bash
        run: |
          set -e

          FILE="app/src/main/res/layout/activity_main.xml"

          echo "========================================"
          echo "ACTIVITY MAIN XML"
          echo "========================================"

          cat "$FILE"

          test -s "$FILE" || {
            echo "ERREUR: activity_main.xml est vide"
            exit 1
          }

          echo "OK: activity_main.xml"

      # ============================================================
      # 12. PREPARATION DE GRADLE
      # ============================================================
      - name: 12 - Preparer Gradle
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "=== VERSION GRADLE ==="
          ./gradlew --version

      # ============================================================
      # 13. VERIFICATION DES TACHES GRADLE
      # ============================================================
      - name: 13 - Verifier les taches Gradle
        shell: bash
        run: |
          set -e

          ./gradlew :app:tasks --all --no-daemon | tee gradle_tasks.txt

          grep -q "assembleDebug" gradle_tasks.txt || {
            echo "ERREUR: assembleDebug introuvable"
            exit 1
          }

          echo "OK: assembleDebug existe"

      # ============================================================
      # 14. NETTOYAGE COMPLET
      # ============================================================
      - name: 14 - Nettoyer le projet
        run: |
          ./gradlew clean --no-daemon --stacktrace

      # ============================================================
      # 15. COMPILATION JAVA
      # ============================================================
      - name: 15 - Compiler le code Java
        run: |
          ./gradlew :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 16. TESTS UNITAIRES
      # ============================================================
      - name: 16 - Executer les tests unitaires
        run: |
          ./gradlew :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 17. VERIFICATION LINT
      # ============================================================
      - name: 17 - Executer Android Lint
        run: |
          ./gradlew :app:lintDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 18. CONSTRUCTION APK DEBUG
      # ============================================================
      - name: 18 - Construire APK Debug
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ============================================================
      # 19. RECHERCHE DE L'APK
      # ============================================================
      - name: 19 - Rechercher APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "RECHERCHE APK"
          echo "========================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_PATH="$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "ERREUR: AUCUN APK GENERE"
            exit 1
          fi

          echo "APK TROUVE:"
          echo "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # ============================================================
      # 20. VERIFICATION DU FICHIER APK
      # ============================================================
      - name: 20 - Verifier APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFICATION APK"
          echo "========================================"

          test -f "$APK_PATH" || {
            echo "ERREUR: APK introuvable"
            exit 1
          }

          test -s "$APK_PATH" || {
            echo "ERREUR: APK vide"
            exit 1
          }

          ls -lh "$APK_PATH"

          echo ""
          echo "=== AAPT BADGING ==="

          "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            dump badging "$APK_PATH"

          echo ""
          echo "APK VALIDE."

      # ============================================================
      # 21. VERIFICATION DU PACKAGE
      # ============================================================
      - name: 21 - Verifier le package APK
        shell: bash
        run: |
          set -e

          PACKAGE_NAME="$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            dump badging "$APK_PATH" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p" |
            head -n 1
          )"

          if [ -z "$PACKAGE_NAME" ]; then
            echo "ERREUR: package introuvable dans APK"
            exit 1
          fi

          echo "PACKAGE APK:"
          echo "$PACKAGE_NAME"

          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

      # ============================================================
      # 22. COPIE DE L'APK DANS UN DOSSIER PROPRE
      # ============================================================
      - name: 22 - Prepararer APK pour artifact
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          cp "$APK_PATH" \
            "artifacts/Ganama-Quincaillerie-Debug.apk"

          ls -lh artifacts/

      # ============================================================
      # 23. PUBLIER L'APK
      # ============================================================
      - name: 23 - Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Ganama-Quincaillerie-APK-Debug
          path: artifacts/Ganama-Quincaillerie-Debug.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 24. RAPPORT FINAL
      # ============================================================
      - name: 24 - Rapport final
        if: always()
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "RAPPORT FINAL"
          echo "========================================"

          if [ -n "${APK_PATH:-}" ] && [ -f "$APK_PATH" ]; then
            echo "RESULTAT: SUCCES"
            echo "APK: $APK_PATH"
            echo "PACKAGE: ${PACKAGE_NAME:-inconnu}"
          else
            echo "RESULTAT: ECHEC"
            echo "Aucun APK disponible."
          fi

          echo ""
          echo "========================================"
          echo "FIN DU TEST"
          echo "========================================"
