name: Build Ganama Quincaillerie APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.13
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip
          echo "$PWD/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Rendre Gradle exécutable
        run: chmod +x gradlew

      - name: Vérifier Gradle
        run: gradle --version

      - name: Compiler Ganama Quincaillerie
        run: ./gradlew assembleDebug --no-daemon

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Ganama-Quincaillerie-APK
          path: app/build/outputs/apk/debug/app-debug.apk
