      - name: Décompresser le projet Android
        run: |
          mkdir -p extracted

          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun fichier ZIP trouvé"
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"
          unzip -q "$ZIP" -d extracted

          SETTINGS_FILE=$(find extracted -type f -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERREUR : settings.gradle.kts introuvable"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Projet Android trouvé : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
