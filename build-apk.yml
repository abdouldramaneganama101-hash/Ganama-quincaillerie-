name: Build Ganama Quincaillerie APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # 1. Chercher directement le projet dans le dépôt
          if [ -f "settings.gradle.kts" ] && [ -d "app" ]; then
            PROJECT_DIR="."
          elif [ -f "settings.gradle" ] && [ -d "app" ]; then
            PROJECT_DIR="."
          fi

          # 2. Si le projet n'est pas à la racine, chercher dans les dossiers
          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS_FILE=$(find . -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -not -path "./.git/*" | head -n 1)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi

          # 3. Si toujours rien, chercher dans le ZIP
          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              echo "ZIP trouvé : $ZIP_FILE"

              mkdir -p extracted
              unzip -q "$ZIP_FILE" -d extracted

              SETTINGS_FILE=$(find extracted -type f \
                \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
                | head -n 1)

              if [ -n "$SETTINGS_FILE" ]; then
                PROJECT_DIR=$(dirname "$SETTINGS_FILE")
              fi
            fi
          fi

          # 4. Vérification finale
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : aucun projet Android avec settings.gradle(.kts) n'a été trouvé."
            echo "Fichiers trouvés :"
            find . -maxdepth 4 -type f | head -n 200
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERREUR : le dossier app est absent de $PROJECT_DIR"
            exit 1
          fi

          echo "Projet Android trouvé : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Make Gradle executable
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ganama-Quincaillerie-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
